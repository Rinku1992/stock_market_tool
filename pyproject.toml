[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smt"
version = "0.0.1"
description = "Stock market research engine: orchestrator, research units, analysts, tools"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0",
    "pyarrow>=15",
    "langgraph>=1.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smt = ["desks/weights/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
